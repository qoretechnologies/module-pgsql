stages:
  - test

default:
  tags:
    - k8s
  services:
    - name: pgvector/pgvector:pg18
      alias: pgsql
  before_script:
    - . test/docker_test/tree-tested-skip.sh

variables:
  REPO_NAME: module-pgsql
  POSTGRES_PASSWORD: qore
  POSTGRES_PASSWORD_MAP: pgsql=qore
  TZ: 'Europe/Prague'
  PGTZ: 'Europe/Prague'

# Reuse successful tests only for a push to develop with an identical Git tree.
# Missing/incomplete API evidence retains both full platform jobs.
tree-already-tested:
  stage: .pre
  needs:
    - job: github-pending
      artifacts: false
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  services: []
  before_script: []
  variables:
    GIT_DEPTH: "3"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push" && $QORE_CI_FORCE_FULL != "1"'
  script:
    - python3 -B -W error test/docker_test/test_squash_head.py
    - python3 test/docker_test/tree-already-tested.py
  artifacts:
    reports:
      dotenv: tree-tested.env

test-ubuntu:
  stage: test
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  script:
    - test/docker_test/test-ubuntu.sh

test-alpine:
  stage: test
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  script:
    - test/docker_test/test-alpine.sh

# The required check represents this pipeline, including any platform jobs that reused a tested tree.
.github-status-job:
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  services: []
  before_script: []

github-pending:
  extends: .github-status-job
  stage: .pre
  script:
    - sh test/docker_test/ci-github-status.sh pending

pipeline-passed:
  extends: .github-status-job
  stage: .post
  when: on_success
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
      artifacts: false
    - job: test-ubuntu
      artifacts: false
    - job: test-alpine
      artifacts: false
  script:
    - sh test/docker_test/ci-github-status.sh passed
  artifacts:
    when: always
    paths: [ci-pipeline-passed]
    expire_in: 7 days

github-status:
  extends: .github-status-job
  stage: .post
  when: always
  needs:
    - job: pipeline-passed
      artifacts: true
  script:
    - sh test/docker_test/ci-github-status.sh final
